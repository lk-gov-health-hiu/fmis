<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <body>

        <ui:composition template="/template.xhtml">

            <ui:define name="title">
                Special Vehicle Fuel Request
            </ui:define>

            <ui:define name="content">
                <div class="container p-1" >
                    <h:form >
                        <div class="row justify-content-md-center" >
                            <div class="col-12 col-sm-12 col-md-10 col-lg-8" >
                                <p:panelGrid 
                                    columns="2" 
                                    styleClass="form-panelgrid" 
                                    columnClasses="form-label,form-field" 
                                    class="w-100">
                                    <f:facet name="header" >
                                        <h2><h:outputText value="Special Vehicle Fuel Request"></h:outputText>
                                            <h:commandButton  value="Submit" 
                                                              style="float: right;"
                                                              class="btn btn-primary"
                                                              action="#{fuelRequestAndIssueController.submitSpecialVehicleFuelRequest()}" >
                                            </h:commandButton>
                                        </h2>
                                    </f:facet>
                                    <p:outputLabel 
                                        value="Date" 
                                        for="calDate">
                                    </p:outputLabel>
                                    <p:calendar 
                                        id="calDate"
                                        pattern="dd MMMM yyyy"
                                        value="#{fuelRequestAndIssueController.selected.requestedDate}" >
                                    </p:calendar>
                                    <p:outputLabel 
                                        value="Vehicle" 
                                        for="acVehicle">
                                    </p:outputLabel>
                                    <p:autoComplete 
                                        id="acVehicle"
                                        value="#{fuelRequestAndIssueController.selected.vehicle}"
                                        completeMethod="#{vehicleController.completeVehiclesByWords}"
                                        var="v"
                                        class="w-100"
                                        inputStyleClass="w-100"
                                        forceSelection="true"
                                        maxResults="20"
                                        itemLabel="#{v.vehicleNumber}"
                                        itemValue="#{v}" 
                                        required="true"
                                        requiredMessage="Please select a Vehicle"
                                        title="Please select a vehicle"
                                        placeholder="Select a vehicle by typing few letters to search">
                                        <p:ajax process="acVehicle" update="lblIns acDriver" ></p:ajax>
                                    </p:autoComplete>

                                    <p:outputLabel 
                                        value="Institution">
                                    </p:outputLabel>
                                    <p:inputText
                                        id="lblIns"
                                        disabled="true"
                                        class="w-100"
                                        value="#{fuelRequestAndIssueController.selected.vehicle.institution.name}" >
                                    </p:inputText>

                                    <p:outputLabel 
                                        value="Driver" 
                                        for="acVehicle">
                                    </p:outputLabel>
                                    <p:selectOneMenu
                                        id="acDriver"
                                        value="#{fuelRequestAndIssueController.selected.driver}"
                                        filter="true"
                                        filterMatchMode="contains"
                                        required="true"
                                        requiredMessage="You must select a driver"
                                        styleClass="form-control w-100">
                                        <f:selectItem itemLabel="Select a driver"  />
                                        <f:selectItems value="#{driverController.institutionAndLoggedInstitutionDrivers(fuelRequestAndIssueController.selected.vehicle.institution)}" var="d"
                                                       itemLabel="#{d.name}" itemValue="#{d}" />
                                    </p:selectOneMenu>



                                    <p:outputLabel 
                                       
                                        value="Fuel Station / Depot" 
                                        >
                                    </p:outputLabel>
                                    <h:panelGroup >
                                        <p:inputText  
                                            readonly="true" 
                                            class="w-100" 
                                            rendered="#{webUserController.loggedInstitution.alternativeSupplyInstitution eq null}"
                                            value="#{fuelRequestAndIssueController.selected.toInstitution.name}" />
                                        <p:selectOneMenu  
                                            rendered="#{webUserController.loggedInstitution.alternativeSupplyInstitution ne null}"
                                            class="w-100" 
                                            required="true"
                                            requiredMessage="Select a Fuel "
                                            value="#{fuelRequestAndIssueController.selected.toInstitution}" >
                                            <f:selectItem 
                                                itemLabel="#{webUserController.loggedInstitution.supplyInstitution.name}" 
                                                itemValue="#{webUserController.loggedInstitution.supplyInstitution}" ></f:selectItem>
                                            <f:selectItem 
                                                itemLabel="#{webUserController.loggedInstitution.alternativeSupplyInstitution.name}" 
                                                itemValue="#{webUserController.loggedInstitution.alternativeSupplyInstitution}" ></f:selectItem>
                                        </p:selectOneMenu>

                                    </h:panelGroup>



                                    <p:outputLabel 
                                        for="txtQty"
                                        value="Requesting Quantity in Liters" 
                                        >
                                    </p:outputLabel>
                                    <p:inputNumber
                                        id="txtQty"
                                        minValue="0"
                                        decimalPlaces="2"
                                        inputStyleClass="form-control"
                                        required="true"
                                        requiredMessage="Quantity is required"
                                        class="w-100"
                                        value="#{fuelRequestAndIssueController.selected.requestQuantity}" ></p:inputNumber>

                                    <p:outputLabel for="txtOdo" value="Vehicle ODO Meter Reading / Generator Hours" />
                                    <p:inputText 
                                        id="txtOdo" 
                                        class="w-100"
                                        required="true" 
                                        requiredMessage="ODO Meter Reading is required" 
                                        value="#{fuelRequestAndIssueController.selected.odoMeterReading}" />

                                    <p:outputLabel 
                                        for="txtRef"
                                        class="w-100"
                                        value="Reference Number">
                                    </p:outputLabel>
                                    <p:inputText
                                        id="txtRef"
                                        class="w-100"
                                        value="#{fuelRequestAndIssueController.selected.requestReferenceNumber}" >
                                    </p:inputText>
                                    <p:outputLabel 
                                        for="txtComments"
                                        value="Comments" 

                                        >
                                    </p:outputLabel>
                                    <p:inputTextarea 
                                        id="txtComments"
                                        class="w-100"
                                        rows="2"
                                        value="#{fuelRequestAndIssueController.selected.comments}" >
                                    </p:inputTextarea>


                                </p:panelGrid>

                                <!-- ODO warning dialog: shown instead of blocking submission outright -->
                                <p:dialog header="ODO Meter Reading Warning"
                                          widgetVar="odoWarningDialog"
                                          modal="true"
                                          closable="false"
                                          responsive="true"
                                          visible="#{fuelRequestAndIssueController.odoWarningPending}">
                                    <div class="p-3">
                                        <p class="text-danger">
                                            <i class="pi pi-exclamation-triangle" />
                                            <h:outputText value=" #{fuelRequestAndIssueController.odoWarningMessage}" />
                                        </p>
                                        <h:panelGroup layout="block" styleClass="border rounded p-2 bg-light"
                                                      rendered="#{fuelRequestAndIssueController.previousOdoTransaction ne null}">
                                            <div class="fw-bold mb-2">Previous ODO reading for this vehicle</div>
                                            <h:panelGrid columns="2" cellpadding="3" styleClass="w-100">
                                                <h:outputText value="ODO Meter Reading" styleClass="text-muted" />
                                                <h:outputText value="#{fuelRequestAndIssueController.previousOdoTransaction.odoMeterReading}" styleClass="fw-bold">
                                                    <f:convertNumber pattern="#,##0" />
                                                </h:outputText>

                                                <h:outputText value="Order Type" styleClass="text-muted" />
                                                <h:outputText value="#{fuelRequestAndIssueController.previousOdoTransaction.specialOrder ? 'Special Order' : 'Normal Order'}"
                                                              styleClass="#{fuelRequestAndIssueController.previousOdoTransaction.specialOrder ? 'badge bg-warning text-dark' : 'badge bg-secondary'}" />

                                                <h:outputText value="Reference No" styleClass="text-muted" />
                                                <h:outputText value="#{fuelRequestAndIssueController.previousOdoTransaction.requestReferenceNumber}" />

                                                <h:outputText value="Requested Date" styleClass="text-muted" />
                                                <h:outputText value="#{fuelRequestAndIssueController.previousOdoTransaction.requestedDate}">
                                                    <f:convertDateTime pattern="dd MMM yyyy" />
                                                </h:outputText>

                                                <h:outputText value="Requested From" styleClass="text-muted" />
                                                <h:outputText value="#{fuelRequestAndIssueController.previousOdoTransaction.fromInstitution.name}" />

                                                <h:outputText value="Fuel Station" styleClass="text-muted" />
                                                <h:outputText value="#{fuelRequestAndIssueController.previousOdoTransaction.toInstitution.name}" />

                                                <h:outputText value="Created By" styleClass="text-muted" />
                                                <h:outputText value="#{fuelRequestAndIssueController.previousOdoTransaction.createdBy.displayName} (#{fuelRequestAndIssueController.previousOdoTransaction.createdBy.name})"
                                                              rendered="#{fuelRequestAndIssueController.previousOdoTransaction.createdBy ne null}" />
                                                <h:outputText value="-" rendered="#{fuelRequestAndIssueController.previousOdoTransaction.createdBy eq null}" />

                                                <h:outputText value="Created At" styleClass="text-muted" />
                                                <h:outputText value="#{fuelRequestAndIssueController.previousOdoTransaction.createdAt}">
                                                    <f:convertDateTime pattern="dd MMM yyyy hh:mm a" />
                                                </h:outputText>
                                            </h:panelGrid>
                                        </h:panelGroup>
                                    </div>
                                    <div class="text-center mt-3 mb-3">
                                        <p:commandButton value="Continue Anyway"
                                                         icon="pi pi-check"
                                                         styleClass="ui-button-raised ui-button-warning mx-1"
                                                         action="#{fuelRequestAndIssueController.acknowledgeOdoWarningAndSubmitSpecialVehicleFuelRequest}"
                                                         ajax="false" />
                                        <p:commandButton value="Go Back and Edit"
                                                         icon="pi pi-times"
                                                         styleClass="ui-button-raised ui-button-secondary mx-1"
                                                         action="#{fuelRequestAndIssueController.cancelOdoWarning}"
                                                         ajax="false" />
                                    </div>
                                </p:dialog>

                            </div>
                        </div>
                    </h:form>
                </div>

            </ui:define>



        </ui:composition>

    </body>
</html>
