<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>

        <ui:composition template="/cpc/admin/index.xhtml">
            <ui:define name="admin">
                <h:form id="FuelPriceForm" style="padding-top: 1rem;" rendered="#{fuelPriceController.priceManager}">
                    <p:messages></p:messages>

                    <p:panelGrid columns="2" class="w-100" rendered="#{fuelPriceController.selected != null}">

                        <f:facet name="header">
                            <h:outputLabel value="Manage Fuel Price" />
                            <p:commandButton ajax="false" style="float: right;" class="btn btn-success"
                                              action="#{fuelPriceController.toListFuelPrices()}" value="Back" />
                        </f:facet>

                        <h:outputLabel value="Effective From:" for="effFrom" />
                        <h:panelGroup>
                            <p:calendar id="effFrom"
                                        value="#{fuelPriceController.selected.effectiveFrom}"
                                        showButtonPanel="true"
                                        pattern="dd MMMM yyyy"
                                        class="w-100" />
                            <div class="text-muted small mt-1">
                                The date the price starts applying, from 00:00:00. If the change actually happened at
                                midnight going into the 14th, enter the 14th here.
                            </div>
                        </h:panelGroup>

                        <h:outputLabel value="Price / Liter (Rs.):" for="price" />
                        <p:inputNumber id="price"
                                       minValue="0"
                                       decimalPlaces="2"
                                       styleClass="w-100"
                                       inputStyleClass="w-100"
                                       value="#{fuelPriceController.selected.pricePerLiter}" />

                        <h:outputLabel value="Remarks:" for="remarks" />
                        <h:inputTextarea id="remarks" class="form-control" rows="3"
                                          value="#{fuelPriceController.selected.remarks}" />

                    </p:panelGrid>

                    <p:commandButton value="Save" icon="pi pi-save" ajax="false"
                                      class="btn btn-primary my-2"
                                      action="#{fuelPriceController.saveFuelPrice()}" />

                </h:form>
            </ui:define>
        </ui:composition>

    </h:body>
</html>
