<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:body>

        <ui:composition template="/institution/admin/index.xhtml">
            <ui:define name="admin">
                <h:form id="VehicleCreateForm" style="padding-top: 1rem;">
                    <p:messages ></p:messages>

                    <p:panelGrid 
                        columns="2" 
                        rendered="#{vehicleController.selected != null and webUserController.vehicleInstitutionChangeAllowed}" class="w-100">

                        <f:facet name="header" >
                            <h:outputText value="Change Institution of Vehicle / Generator" ></h:outputText>
                            <p:commandButton 
                                ajax="false"
                                style="float: right;" 
                                class="btn btn-success" 
                                action="#{vehicleController.saveOrUpdateVehicle()}" 
                                value="Save"/>
                        </f:facet>

                        <h:outputLabel value="Number:" />
                        <h:outputText value="#{vehicleController.selected.vehicleNumber}" />

                        <h:outputLabel value="Type:" />
                        <h:outputText value="#{vehicleController.selected.vehicleType.label}" />

                        <h:outputLabel value="Main Purpose:" />
                        <h:outputText value="#{vehicleController.selected.vehiclePurpose.label}" />

                        <h:outputLabel value="Make:" />
                        <h:outputText value="#{vehicleController.selected.vehicleType.vehicle ? vehicleController.selected.make : vehicleController.selected.vehicleMake}" />

                        <h:outputLabel value="Estimated Monthly Fuel Consumption:" />
                        <h:outputText value="#{vehicleController.selected.estiamtedMonthlyFuelConsumption}" />

                        <h:outputLabel value="Institution:" for="ins" />
                        <p:selectOneMenu 
                            id="ins"
                            filter="true"
                            filterMatchMode="contains"
                            class="form-control form-control-sm w-100" 
                            value="#{vehicleController.selected.institution}" 
                            required="true"
                            requiredMessage="Please select the institute">
                            <f:selectItem itemLabel="Please Select" ></f:selectItem>
                            <f:selectItems value="#{webUserController.loggableInstitutions}"
                                           var="ins" 
                                           itemLabel="#{ins.name}"
                                           itemValue="#{ins}" ></f:selectItems>
                        </p:selectOneMenu>

                    </p:panelGrid>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
